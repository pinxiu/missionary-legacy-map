    # Batang) and Ya'an (Yachow) are in scope.
    name: Sichuan 四川
    extract_hint: >-
      Province of Sichuan, historically Szechwan/Szechuan (四川); city keys: chengdu (Chengtu 成都, Pixian 郫縣, Shuangliu),
      zigong (自貢), panzhihua (攀枝花), luzhou (瀘州, Luchow), deyang (德陽, Tehyang), mianyang (綿陽, Mienchow), guangyuan
      (廣元, Kwangyuan), suining (遂寧, Suiling), neijiang (內江), leshan (樂山, Kiating/Jiading 嘉定), nanchong (南充,
      Shunking/Shunqing 順慶), meishan (眉山), yibin (宜賓, Suifu 敘府), guangan (廣安), dazhou (達州, Tachow), yaan
      (雅安, Yachow), bazhong (巴中, Paochow/Pachow), ziyang (資陽), aba (阿壩, Maoxian), ganzi (甘孜, Kangding/Tatsienlu
      打箭爐, Batang 巴塘), liangshan (涼山, Ningyuan/Xichang 西昌), and, for the historical province, Chongqing
      (重慶, Chungking) and Wanxian (萬縣, Wanzhou). Include Jesuit and Paris Foreign Missions Society Catholic missions
      (vicariates of Chengdu, Chongqing, Suifu, Ningyuan, Kiating, Shunking, Kangding/Tibet), the 1815 martyrs of Chengdu,
      Protestant missions (China Inland Mission, Church Missionary Society, American Baptist, Canadian Methodist,
      American Methodist, Friends Foreign Mission, Church of the Brethren, Seventh-day Adventist, Church of Scotland),
      West China Union University (Huaxi), Canadian School in Chengdu, Chengdu and Chongqing mission hospitals, Tibetan
      border missions (Batang, Tatsienlu, Ya'an), the Miao/Qiang/Yi (Lolo) tribal missions (Gospel in the Ko Hsien),
      indigenous and independent churches (Little Flock), the wartime Chongqing universities and relief organizations,
      schools, hospitals, presses, cemeteries and memorials.
