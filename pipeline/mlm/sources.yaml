      Chuanchow/Chinchew (泉州), Changchow/Chiangchiu (漳州), Hinghwa/Henghua/Hsinghua (興化 = putian),
      Yenping/Yenpingfu (延平 = nanping), Tingchow (汀州 = longyan), Funing (福寧 = ningde), Kutien (古田 = ningde),
      Shaowu (邵武 = nanping), Ingtai/Yongtai, Lienkiang (連江), Fukien. Include Dominican, Jesuit,
      Protestant (ABCFM, CMS, LMS, RCA, English Presbyterian, Methodist), Anglican, independent Chinese churches,
      schools, hospitals, presses and cemeteries.
