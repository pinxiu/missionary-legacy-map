      Zose/Sheshan (佘山), Tushanwan/Tou-se-we (土山湾), Hongkew/Hongkou (虹口), Yangtszepoo/Yangpu (杨树浦),
      Pootung/Pudong (浦东), Nantao (南市), Chapei (闸北), Woosung/Wusong (吴淞), Kiangwan (江湾), Sungkiang/Songjiang (松江),
