  inner-mongolia:
    name: Inner Mongolia
    extract_hint: >-
      Inner Mongolia (内蒙古), historically Suiyuan, Chahar, Jehol and the Ningxia border districts. Prefecture-level cities:
      Hohhot (Huhehaote, Kuei-hua-cheng, Kweihwacheng, Guisui, Suiyuan, 呼和浩特, 归绥), Baotou (Paotow, 包头), Wuhai (乌海),
      Chifeng (Chihfeng, 赤峰), Tongliao (Tungliao, 通辽), Ordos (Dongsheng, Ordos Mission, 鄂尔多斯),
      Hulunbuir (Hailar, Manzhouli, 呼伦贝尔, 海拉尔), Bayannur (Linhe, 巴彦淖尔, 临河), Ulanqab (Jining, 乌兰察布, 集宁),
      Xilin Gol, Hinggan (Wangyehmiao, Ulanhot, 王爷庙), Alxa; also Xiwanzi (西湾子), Dolonnor (Duolun, 多伦), Jehol (热河).
      Include Catholic (CICM Scheut, Lazarists; Vicariates of Central, Eastern and Southwest Mongolia), LMS (Gilmour),
      Scandinavian Alliance and Swedish Mongol Missions, Orthodox, indigenous churches, schools, hospitals, presses,
      cemeteries and memorials; Boxer-era martyrdoms.
