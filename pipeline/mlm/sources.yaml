# Source registry. The source-scout agent proposes additions here via pull request.
# Each entry: where to start, which links to follow, and how far.
# Respect robots.txt and terms of use; the crawler enforces robots.txt and a per-host delay.

regions:
  hangzhou:
    keywords: [Hangzhou, Hangchow, 杭州, Hang-chow, Hangchau]
    sources:
      - name: Biographical Dictionary of Chinese Christianity
        start_urls:
          - https://www.bdcconline.net/en/stories/taylor-james-hudson/
          - https://www.bdcconline.net/en/stories/main-david-duncan/
        follow: ['^https://www\.bdcconline\.net/en/stories/[a-z0-9-]+/?$']
        max_pages: 150
        language: en
      - name: Wikipedia (EN)
        start_urls:
          - https://en.wikipedia.org/wiki/Hangchow_University
          - https://en.wikipedia.org/wiki/David_Duncan_Main
          - https://en.wikipedia.org/wiki/Christ%27s_Church,_Tianshui_Subdistrict
          - https://en.wikipedia.org/wiki/Church_Missionary_Society_in_China
          - https://en.wikipedia.org/wiki/Second_Affiliated_Hospital_of_Zhejiang_University_School_of_Medicine
        follow: []
        max_pages: 20
        language: en
      - name: ChinaSource
        start_urls:
          - https://chsource.org/articles/take-a-tour-of-5-historic-christian-sites-in-hangzhou/
        follow: []
        max_pages: 5
        language: en
      - name: Ricci Roundtable bibliography (subject index)
        start_urls:
          - https://web.bc.edu/ricci/indexSubject.php?id=7208
          - https://web.bc.edu/ricci/indexSubject.php?id=4092
        follow: []
        max_pages: 10
        language: en
        kind: bibliography   # yields citations to find, not facts to extract
      - name: SOAS — CMS in Hangzhou and the Guangji Hospital
        start_urls:
          - https://eprints.soas.ac.uk/40655
        follow: []
        max_pages: 3
        language: en
        kind: journal

  zhejiang:
    # Province-wide crawl (coverage unit CN-ZJ). Each extracted site is assigned to its city (prefecture) by the extractor.
    name: Zhejiang 浙江
    extract_hint: >-
      Prefectures: hangzhou, ningbo, wenzhou, shaoxing, huzhou, jiaxing, taizhou, jinhua, lishui, quzhou, zhoushan.
      Historical spellings: Hangchow, Ningpo, Wenchow, Shaohing, Huchow, Kashing/Kiahsing, Taichow, Kinhwa,
      Chuchow (處州 = lishui), Kuchow/Chüchow (衢州 = quzhou), Chusan/Tinghai (zhoushan).
    keywords: [Zhejiang, Chekiang, 浙江, Hangzhou, Hangchow, 杭州, Ningbo, Ningpo, 宁波, 寧波, Wenzhou, Wenchow, 温州, 溫州,
               Shaoxing, Shaohing, 绍兴, 紹興, Huzhou, Huchow, 湖州, Jiaxing, Kashing, 嘉兴, 嘉興, Taizhou, Taichow, 台州,
               Jinhua, Kinhwa, 金华, 金華, Lishui, Chuchow, 丽水, 處州, Quzhou, 衢州, Zhoushan, Chusan, 舟山]
    sources:
      - name: Biographical Dictionary of Chinese Christianity (Chinese, Zhejiang places)
        start_urls:
          - https://www.bdcconline.net/zh-hans/places/zhejiang/
          - https://www.bdcconline.net/zh-hans/places/hangzhou/
          - https://www.bdcconline.net/zh-hans/places/ningbo/
          - https://www.bdcconline.net/zh-hans/places/wenzhou/
          - https://www.bdcconline.net/zh-hans/places/shaoxing/
          - https://www.bdcconline.net/zh-hans/places/huzhou/
          - https://www.bdcconline.net/zh-hans/places/jiaxing/
          - https://www.bdcconline.net/zh-hans/places/taizhou/
          - https://www.bdcconline.net/zh-hans/places/jinhua/
          - https://www.bdcconline.net/zh-hans/places/lishui/
          - https://www.bdcconline.net/zh-hans/places/quzhou/
          - https://www.bdcconline.net/zh-hans/places/zhoushan/
          - https://www.bdcconline.net/zh-hans/places/zhejiang/?page=1
          - https://www.bdcconline.net/zh-hans/places/zhejiang/?page=2
          - https://www.bdcconline.net/zh-hans/places/zhejiang/?page=3
        follow: ['^https://www\.bdcconline\.net/zh-hans/stories/[a-z0-9-]+/?$']
        max_pages: 250
        max_depth: 1
        language: zh
      - name: Biographical Dictionary of Chinese Christianity (English, Zhejiang)
        start_urls:
          - https://www.bdcconline.net/en/places/zhejiang/
          - https://www.bdcconline.net/en/places/ningbo/
          - https://www.bdcconline.net/en/places/wenzhou/
        follow: ['^https://www\.bdcconline\.net/en/stories/[a-z0-9-]+/?$']
        max_pages: 200
        max_depth: 1
        language: en
      - name: Western Medicine in China (IU Indianapolis) — Zhejiang hospitals
        start_urls:
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Hangchow%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Ningpo%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Wenchow%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Shaohing%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Huchow%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Kashing%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Taichow%22
          - https://library.indianapolis.iu.edu/wmicproject/search_institutions/results/field_city:%22Kinhwa%22
        follow: ['^https://library\.indianapolis\.iu\.edu/wmicproject/node/\d+$']
        max_pages: 120
        max_depth: 1
        language: en
      - name: Wikipedia (EN) — Zhejiang mission institutions
        start_urls:
          - https://en.wikipedia.org/wiki/Hangchow_University
          - https://en.wikipedia.org/wiki/The_First_Hospital_of_Jiaxing
          - https://en.wikipedia.org/wiki/William_Edward_Soothill
          - https://en.wikipedia.org/wiki/George_Stott_(missionary)
          - https://en.wikipedia.org/wiki/Mary_Ann_Aldersey
          - https://en.wikipedia.org/wiki/Divie_Bethune_McCartee
        follow: []
        max_pages: 20
        language: en

  jiangsu:
    # Province-wide crawl (coverage unit CN-JS). Each extracted site is assigned to its city (prefecture) by the extractor.
    name: Jiangsu 江苏
    extract_hint: >-
      Prefectures: nanjing, wuxi, xuzhou, changzhou, suzhou, nantong, lianyungang, huaian, yancheng, yangzhou,
      zhenjiang, taizhou, suqian. Historical spellings: Nanking/Kiangning (江寧), Soochow, Wusih, Hsuchow/Süchow
      (徐州), Changchow (常州), Tungchow (通州 = nantong), Haichow (海州 = lianyungang), Huaiyin/Tsingkiangpu
      (清江浦 = huaian), Yencheng, Yangchow, Chinkiang, Taichow (泰州, not the Zhejiang Taizhou).
    keywords: [Jiangsu, Kiangsu, 江苏, 江蘇, Nanjing, Nanking, 南京, Kiangning, 江寧, Wuxi, Wusih, 无锡, 無錫,
               Xuzhou, Hsuchow, Suchow, 徐州, Changzhou, Changchow, 常州, Suzhou, Soochow, 苏州, 蘇州,
               Nantong, Tungchow, 南通, 通州, Lianyungang, Haichow, 连云港, 海州, Huaian, Huaiyin, Tsingkiangpu, 淮安, 清江浦,
               Yancheng, Yencheng, 盐城, 鹽城, Yangzhou, Yangchow, 扬州, 揚州, Zhenjiang, Chinkiang, 镇江, 鎮江,
               Taizhou, 泰州, Suqian, 宿迁, 宿遷]
