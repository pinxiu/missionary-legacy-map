[project]
name = "mlm"
version = "0.1.0"
description = "Missionary Legacy Map data pipeline: crawl, extract, resolve, geocode, review, load"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=1.0",
  "pyyaml>=6",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mlm = "mlm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlm*"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"mlm/coverage.py" = ["E501"]
"mlm/verify.py" = ["E501"]
"mlm/apply.py" = ["E501"]
"tests/*" = ["E501"]
