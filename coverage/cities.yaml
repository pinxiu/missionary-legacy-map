# Cities (prefecture level) of provinces added after Zhejiang: slug, names and a centre point.
# Used to place sites at city precision when no better location is known, and to create the `regions` rows.
# A slug already used by another province gets a province suffix (taizhou-js); load maps the extractor's "taizhou"
# to the right one inside the unit. Centre points are modern city centres (geography, not historical claims).
