# Coverage catalog: the units of work for expanding the map.
# One GitHub issue per unit (mlm coverage sync). Agent workers take ONE active unit at a time, in `order`.
# Correctness over speed: a unit is only "done" when every published record passed the verifier,
# the independent audit agrees >= 95%, and the owner approved the unit's batch.

themes:   # every unit is researched across all of these, not only missionary work
  - {id: church_of_the_east, en: "Church of the East (Jingjiao) and early Christianity", zh: "景教与早期基督教"}
  - {id: catholic, en: "Catholic missions, parishes and religious orders", zh: "天主教传教、堂区与修会"}
  - {id: protestant, en: "Protestant missions and churches", zh: "基督教新教差会与教会"}
  - {id: orthodox, en: "Orthodox missions and churches", zh: "东正教传教与教堂"}
  - {id: indigenous, en: "Indigenous and independent churches and movements", zh: "本土及自立教会与运动"}
  - {id: revivals, en: "Revivals, evangelists and church leaders", zh: "复兴运动、布道家与教会领袖"}
  - {id: education_medicine, en: "Schools, universities, hospitals and social work", zh: "学校、大学、医院与社会事业"}
  - {id: translation_print, en: "Bible translation, presses and publishing", zh: "圣经翻译、印书馆与出版"}
  - {id: martyrs_memorials, en: "Martyrs, cemeteries and memorials", zh: "殉道者、墓地与纪念地"}

done_when:
  min_sources: 3                # registered sources, at least one in Chinese for China units
  verifier_pass_rate: 1.0       # every published record passed the verifier
  min_audit_sample: 10          # audited records (or all, if fewer)
  audit_agreement: 0.95
  owner_approval: true          # the owner approves the unit's batch before anything is published

phases:
  - {phase: 1, en: "China", zh: "中国"}
  - {phase: 2, en: "World", zh: "世界"}

