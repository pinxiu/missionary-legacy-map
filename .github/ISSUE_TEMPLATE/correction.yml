name: Correction or new source
description: Report an error or suggest a source for a site on the map
labels: [correction]
body:
  - type: input
    id: site
    attributes:
      label: Site
      description: Name of the site as shown on the map
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What should change?
      description: The fact that is wrong or missing
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link or full citation that supports the change (book, archive, article)
    validations:
      required: true
