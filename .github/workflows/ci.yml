name: CI

# Pipeline lint and tests, only when the pipeline (or this file) changes. The web build is ci-web.yml.
# Status, data and docs commits don't run CI, and a newer push cancels a run still in progress.
on:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
