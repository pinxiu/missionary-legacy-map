name: Data pipeline

# Manual runs of the pipeline for one unit. Scheduled work happens in coverage-agents.yml.
# Audit disagreements become `needs-decision` issues for the owner.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Coverage unit id (e.g. CN-ZJ). Scheduled work runs in coverage-agents.yml
        default: CN-ZJ
      region:
        description: Region slug from pipeline/mlm/sources.yaml
        default: zhejiang
      stage:
        description: Stage to run
        type: choice
        options: [all, crawl, extract, translate, load, verify, audit]
        default: all

permissions:
  contents: read
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNIT: ${{ inputs.unit || 'CN-ZJ' }}
      REGION: ${{ inputs.region || 'zhejiang' }}
      STAGE: ${{ inputs.stage || 'all' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: free-tier translation
      MLM_BATCH_WAIT_MIN: "10"   # a batch still running is collected by the next run
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .

      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$SUPABASE_SECRET_KEY" ] && missing="$missing SUPABASE_SECRET_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL(variable)"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then echo "::warning::Missing:$missing. Crawl will run; extract/load/review will be skipped."; fi

      # Split restore/save so paid extractions survive a failed later stage (see coverage-agents.yml).
      - name: Restore crawl + extraction cache
        uses: actions/cache/restore@v4
        with:
          path: .mlm-work
          key: mlm-work-${{ env.REGION }}-${{ github.run_id }}
          restore-keys: mlm-work-${{ env.REGION }}-

      - name: Crawl
        if: env.STAGE == 'all' || env.STAGE == 'crawl'
        run: |
          mlm run --unit "$UNIT" --region "$REGION" --stage crawl
          n=$(ls ../.mlm-work/raw/"$REGION" 2>/dev/null | wc -l)
          echo "### Crawl: $n pages cached for $REGION" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract
        if: (env.STAGE == 'all' || env.STAGE == 'extract') && !contains(steps.secrets.outputs.missing, 'ANTHROPIC')
        run: mlm run --unit "$UNIT" --region "$REGION" --stage extract

      - name: Translate (glossary, Wikidata, then Gemini free tier or Haiku)
        if: (env.STAGE == 'all' || env.STAGE == 'translate') && !contains(steps.secrets.outputs.missing, 'ANTHROPIC')
        run: mlm run --unit "$UNIT" --region "$REGION" --stage translate

      - name: Load
        if: (env.STAGE == 'all' || env.STAGE == 'load') && steps.secrets.outputs.missing == ''
        run: mlm run --unit "$UNIT" --region "$REGION" --stage load

      - name: Verify (trusted)
        if: (env.STAGE == 'all' || env.STAGE == 'verify') && steps.secrets.outputs.missing == ''
        run: mlm run --unit "$UNIT" --region "$REGION" --stage verify

      - name: Audit (independent model)
        if: (env.STAGE == 'all' || env.STAGE == 'audit') && steps.secrets.outputs.missing == ''
        run: |
          mlm run --unit "$UNIT" --region "$REGION" --stage audit
          mlm decisions sync
          mlm decisions rejected --unit "$UNIT"

      - name: Save crawl + extraction cache (also after a failure)
        if: always() && hashFiles('.mlm-work/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .mlm-work
          key: mlm-work-${{ env.REGION }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlm-work-${{ env.REGION }}
          path: |
            .mlm-work/raw
            .mlm-work/extracted
          if-no-files-found: ignore
          retention-days: 30
