name: Data pipeline

# Weekly: crawl registered sources -> Claude extraction -> load as pending -> review agent.
# Approved records appear on the site within an hour (ISR). Everything else lands in the
# "Review queue" issue for a human.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      region:
        description: Region slug from pipeline/mlm/sources.yaml
        default: hangzhou
      stage:
        description: Stage to run
        type: choice
        options: [all, crawl, extract, load, review]
        default: all

permissions:
  contents: read
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGION: ${{ inputs.region || 'hangzhou' }}
      STAGE: ${{ inputs.stage || 'all' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .

      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$SUPABASE_SECRET_KEY" ] && missing="$missing SUPABASE_SECRET_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL(variable)"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then echo "::warning::Missing:$missing. Crawl will run; extract/load/review will be skipped."; fi

      - name: Restore crawl + extraction cache
        uses: actions/cache@v4
        with:
          path: .mlm-work
          key: mlm-work-${{ env.REGION }}-${{ github.run_id }}
          restore-keys: mlm-work-${{ env.REGION }}-

      - name: Crawl
        if: env.STAGE == 'all' || env.STAGE == 'crawl'
        run: |
          mlm run --region "$REGION" --stage crawl
          n=$(ls ../.mlm-work/raw/"$REGION" 2>/dev/null | wc -l)
          echo "### Crawl: $n pages cached for $REGION" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract
        if: (env.STAGE == 'all' || env.STAGE == 'extract') && !contains(steps.secrets.outputs.missing, 'ANTHROPIC')
        run: mlm run --region "$REGION" --stage extract

      - name: Load
        if: (env.STAGE == 'all' || env.STAGE == 'load') && steps.secrets.outputs.missing == ''
        run: mlm run --region "$REGION" --stage load

      - name: Review agent
        if: (env.STAGE == 'all' || env.STAGE == 'review') && steps.secrets.outputs.missing == ''
        run: mlm run --region "$REGION" --stage review

      - name: Update review-queue issue
        if: hashFiles('.mlm-work/review-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          num=$(gh issue list --label review-queue --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh label create review-queue --color C2A878 --description "Pipeline items needing human review" 2>/dev/null || true
            gh issue create --title "Review queue" --label review-queue --body-file .mlm-work/review-report.md
          else
            gh issue edit "$num" --body-file .mlm-work/review-report.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlm-work-${{ env.REGION }}
          path: |
            .mlm-work/raw
            .mlm-work/extracted
          if-no-files-found: ignore
          retention-days: 30
