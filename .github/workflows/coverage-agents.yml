name: Coverage agents

# Background workers for expanding coverage (coverage/catalog.yaml), ONE unit at a time, correctness first.
#   1. Pick the active unit (in-progress, else next todo). No unit: stop. (free)
#   2. If the unit has no sources yet, a source-scout agent proposes some; trusted code validates them.
#   3. Find (per city, into the resource pool) → parse every unread page once for all places worldwide → translate → resolve
#      (match, file under each place's unit, pin) → trusted verifier → independent audit.
#   4. Status job updates the unit issue and STATUS.md; when the gates are met the unit is published and marked done.
# A unit publishes itself when its gates are met (audit agreement >= 80%); the owner's `approved` label also publishes it
# (apply-approved.yml, or the status job's catch-up if that event was missed).

# GitHub often drops scheduled runs, so the schedule fires every hour and the cheap `due` job lets the real work run
# only when no run has started in the last ~55 minutes. A run works through several provinces, so runs follow each other
# back to back (the concurrency group queues them) until China is covered.
on:
  schedule:
    - cron: "17 * * * *"   # each check bills at least a minute; work is due about every 3 hours
  workflow_dispatch:
    inputs:
      unit:
        description: Unit id to work on (default = active unit)
        default: ""

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: coverage-agents
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read  # the workflow-level permissions don't include it, and this job lists earlier runs
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Runs that actually did work: anything but runs that were skipped as not due (those finish in seconds).
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/coverage-agents.yml/runs?per_page=40" --jq \
            '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion != "skipped")
              | select((.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601) > 300 or .status != "completed")
              | .run_started_at][0] // "1970-01-01T00:00:00Z"')
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "last real run started $last ($((age / 60)) min ago)"
          if [ "$age" -ge 3300 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  work:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: free-tier translation
      AMAP_KEY: ${{ secrets.AMAP_KEY }}               # optional: Amap place search for exact pins in China
      MLM_BATCH_WAIT_MIN: "10"    # don't keep a billed runner idle: a batch still running is collected by the next run
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"

      - name: Pick units (no model call)
        id: unit
        run: |
          u="${{ inputs.unit }}"
          [ -z "$u" ] && u=$(mlm coverage next)
          echo "id=$u" >> "$GITHUB_OUTPUT"
          if [ -n "$u" ]; then
            region=$(python3 -c "from mlm import coverage as c; print(c.unit('$u')['region'])")
            echo "region=$region" >> "$GITHUB_OUTPUT"
          fi
          # the next few units that have no sources yet: one scout pass covers all of them, so sources never hold up a run
          need=$(mlm coverage upcoming --n 6 | awk '$3=="no"{print $2}' | tr '\n' ' ')
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "### Coverage agents: unit '${u:-none}'; scouting: ${need:-nothing}" >> "$GITHUB_STEP_SUMMARY"

      - name: Source scout (only when the unit has no sources yet)
        if: steps.unit.outputs.need != ''
        uses: anthropics/claude-code-action@v1
        with:
          # Your Claude subscription pays when CLAUDE_CODE_OAUTH_TOKEN is set (`claude setup-token`); the API key is the fallback.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools "Read,Edit,WebSearch,WebFetch"
          prompt: |
            Follow .claude/agents/source-scout.md. Region keys to add (do all of them, one entry each): ${{ steps.unit.outputs.need }}.
            Read coverage/catalog.yaml for each unit and its themes (all significant Christian movements, not only missions).
            Add one new region entry per key above to pipeline/mlm/sources.yaml, each with: name, extract_hint
            (prefecture-level cities in pinyin and historical spellings), keywords (English, historical romanizations, Simplified
            and Traditional Chinese), and 4-10 reputable sources with modest max_pages and max_depth: 1 where they list links,
            covering the province and, where sources exist, its main cities (city gazetteers, diocesan and mission-station
            histories, university and hospital histories). Include at least one Chinese-language source. Check each start URL loads. Do not edit any other file.

      # The scout action leaves git on its own branch with its own (revoked) credentials, so every later `git push`
      # failed with exit 128. Put the working tree back on main with this job's token, keeping the scout's edit.
      - name: Restore git state after scout
        if: steps.unit.outputs.need != ''
        run: |
          cp pipeline/mlm/sources.yaml "$RUNNER_TEMP/sources.yaml"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin main
          git checkout -q -f -B main origin/main
          cp "$RUNNER_TEMP/sources.yaml" pipeline/mlm/sources.yaml
          git status -sb | head -3

      - name: Validate scout output (trusted)
        if: steps.unit.outputs.need != ''
        run: |
          python3 - <<'EOF'
          import yaml, sys
          from urllib.parse import urlparse
          regs = yaml.safe_load(open("pipeline/mlm/sources.yaml"))["regions"]
          for key in "${{ steps.unit.outputs.need }}".split():
              reg = regs.get(key)
              if not reg:  # a region the scout didn't finish waits for the next run; the loop below skips units without sources
                  print("no sources yet for", key)
                  continue
              assert reg.get("keywords") and reg.get("sources"), f"{key}: region needs keywords and sources"
              for s in reg["sources"]:
                  assert s.get("name") and s.get("start_urls"), s
                  assert all(urlparse(u).scheme == "https" for u in s["start_urls"]), s["start_urls"]
                  assert int(s.get("max_pages", 20)) <= 300, "max_pages too high"
          print("ok")
          EOF
          git diff --stat -- pipeline/mlm/sources.yaml
          [ -z "$(git status --porcelain -- . ':!pipeline/mlm/sources.yaml')" ] || { echo "scout edited other files"; git status --porcelain; exit 1; }
          git config user.name "legacy-map-bot"; git config user.email "legacy-map-bot@users.noreply.github.com"
          git add pipeline/mlm/sources.yaml && git commit -m "Sources for ${{ steps.unit.outputs.need }}(source scout)" && git pull --rebase -q && git push origin HEAD:main

      # Restore and save are split so the cache is saved even when a later step fails. With plain actions/cache a
      # failed run discarded every page it had already paid Sonnet to extract, and the next run extracted them again.
      - name: Restore crawl + extraction cache
        if: steps.unit.outputs.id != ''
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .mlm-work
          key: mlm-work-all-${{ github.run_id }}
          restore-keys: |
            mlm-work-all-
            mlm-work-${{ steps.unit.outputs.region }}-

      - name: Pipeline (find → parse → translate → resolve → verify → audit)
        if: steps.unit.outputs.id != ''
        run: |
          # Work through the upcoming units in order, one at a time (each unit finishes its own find → audit before the next
          # starts), until the time budget is used. A unit that is still short of its gates after its run (say the audit
          # agreement is under 80%) stays open for the next run but no longer holds the others back. `coverage status`
          # after each unit publishes it if its gates are met.
          start=$(date +%s); n=0
          if [ -n "${{ inputs.unit }}" ]; then list="${{ inputs.unit }} x yes"; else list=$(mlm coverage upcoming --n 8); fi
          echo "$list" | while read -r u region has; do
            [ -n "$u" ] || continue
            [ "$has" = yes ] || { echo "unit $u has no sources yet; the next run's scout adds them"; continue; }
            [ $(( $(date +%s) - start )) -lt 12000 ] || { echo "time budget used; $u waits for the next run"; break; }
            echo "### unit $u" >> "$GITHUB_STEP_SUMMARY"
            mlm run --unit "$u" < /dev/null || echo "unit $u failed; continuing with the next"
            mlm coverage status < /dev/null > /dev/null || true
          done

      # Pages found for one unit hold places in others, so units that are already done keep gaining verified records.
      # Trusted code audits a sample of each such batch and publishes it only if the sample agrees (the 80% gate).
      - name: Audit and publish new records in finished units (trusted)
        if: steps.unit.outputs.id != ''
        run: mlm coverage sweep

      - name: Save crawl + extraction cache (also after a failure)
        if: always() && steps.unit.outputs.id != '' && steps.cache.outcome != 'skipped' && hashFiles('.mlm-work/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .mlm-work
          key: mlm-work-all-${{ github.run_id }}

      - name: Status, gates and scoreboard (trusted)
        if: always() && steps.unit.outputs.id != ''
        run: |
          mlm decisions sync
          mlm decisions rejected
          mlm coverage status > /dev/null
          if [ -n "$(git status --porcelain STATUS.md)" ]; then
            git config user.name "legacy-map-bot"; git config user.email "legacy-map-bot@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add STATUS.md && git commit -m "Coverage status" -q
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
