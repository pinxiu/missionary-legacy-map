name: Source scout agent

# Weekly agent that looks for new primary/secondary sources for the current region
# and opens a PR adding them to pipeline/mlm/sources.yaml. A human merges the PR.

on:
  schedule:
    - cron: "41 10 * * 3"   # Wednesdays 10:41 UTC
  workflow_dispatch:
    inputs:
      region:
        description: Region to scout
        default: hangzhou

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 40 --allowedTools "WebSearch,WebFetch,Read,Edit,Write,Bash(git:*),Bash(gh pr:*)"
          prompt: |
            Use the source-scout subagent definition in .claude/agents/source-scout.md.
            Region: ${{ inputs.region || 'hangzhou' }}.
            Find up to 8 new, reputable sources about historical (pre-1952) Christian mission sites in this region
            that are not already in pipeline/mlm/sources.yaml. Add them to the registry, then open one PR on a branch
            named scout/<date> with a table of what you added and why each is trustworthy.
            If you find nothing worth adding, do not open a PR.
