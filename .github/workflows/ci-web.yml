name: CI web

# Web build, only when the app (or this file) changes. A newer push cancels a run still in progress.
on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/ci-web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/ci-web.yml"]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
