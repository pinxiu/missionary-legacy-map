name: Coverage sync

# One GitHub issue per coverage unit (idempotent), plus a daily scoreboard refresh. No model calls.
on:
  push:
    branches: [main]
    paths: [coverage/catalog.yaml]
  schedule:
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - run: mlm coverage sync
      - run: mlm decisions sync
      - run: |
          mlm coverage status > /dev/null
          if [ -n "$(git status --porcelain STATUS.md)" ]; then
            git config user.name "legacy-map-bot"; git config user.email "legacy-map-bot@users.noreply.github.com"
            git add STATUS.md && git commit -m "Coverage status" && git push
          fi
