name: Maintenance

# One-off data maintenance, run by hand. No model calls, except verify-recheck (the trusted verifier's support check).
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [dedupe-dry-run, dedupe, refresh-site, regeocode-jiangsu, regeocode-shanghai, regeocode-fujian, regeocode-guangdong, pool-backfill, locate-dry-run, locate-apply, ohm-probe, amap-check, ohm-planet-check, ohm-planet-list, verify-recheck-dry-run, verify-recheck]
        default: dedupe-dry-run

permissions:
  contents: read

concurrency:
  group: coverage-agents  # never alongside the worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMAP_KEY: ${{ secrets.AMAP_KEY }}  # optional: Amap POI search
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - if: inputs.task == 'dedupe-dry-run'
        run: mlm dedupe --dry-run
      - if: inputs.task == 'dedupe'
        run: mlm dedupe
      - if: inputs.task == 'refresh-site'
        run: mlm refresh-site
      - if: inputs.task == 'verify-recheck-dry-run'
        run: mlm verify-recheck --dry-run
      - if: inputs.task == 'verify-recheck'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MLM_BATCH_WAIT_MIN: "15"
        run: mlm verify-recheck   # unit gates and STATUS.md refresh in the daily coverage-sync
      - if: inputs.task == 'regeocode-jiangsu'
        run: |
          mlm regeocode --unit CN-JS
          mlm refresh-site
      - if: inputs.task == 'regeocode-shanghai'
        run: |
          mlm regeocode --unit CN-SH
          mlm refresh-site
      - if: inputs.task == 'locate-dry-run'
        run: mlm locate   # report only: candidates are listed in the job summary
      - if: inputs.task == 'locate-apply'
        run: |
          mlm locate --apply
          mlm refresh-site
      - if: inputs.task == 'amap-check'
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          [ -n "$AMAP_KEY" ] || { echo "::error::AMAP_KEY secret is not set"; exit 1; }
          curl -sS "https://restapi.amap.com/v3/place/text?key=$AMAP_KEY&keywords=%E5%A4%A9%E4%B8%BB%E5%A0%82&city=%E6%9D%AD%E5%B7%9E&offset=3" | head -c 600
          echo; echo "If status is 1 above the key works; then run locate-dry-run."
      - if: inputs.task == 'ohm-planet-check'
        run: |
          for u in https://planet.openhistoricalmap.org/ https://planet.openhistoricalmap.org/planet/ ; do
            echo "== $u"; curl -sS -m 30 -A "missionary-legacy-map/1.0 (github.com/pinxiu/missionary-legacy-map)" -o /tmp/o.html -w "HTTP %{http_code}" "$u" > /tmp/code.txt || true
            echo "::notice::ohm-planet $u $(cat /tmp/code.txt) $(head -c 200 /tmp/o.html | tr '\n' ' ')"
          done
      - if: inputs.task == 'ohm-planet-list'
        run: |
          curl -sS -m 30 "https://planet.openhistoricalmap.org/list.js" | grep -oE "(https?://[^'\" ]+|'[a-zA-Z0-9_./-]*(planet|xml|pbf|bz2)[^']*')" | sort -u | head -15 | tr '\n' ' ' > /tmp/js.txt || true
          echo "::notice::ohm-js $(cat /tmp/js.txt)"
          curl -sS -m 30 "https://planet.openhistoricalmap.org/?list-type=2&max-keys=1000" -o /tmp/l.xml || true
          curl -sS -m 30 "https://planet.openhistoricalmap.org/" | grep -oE "(src|href)=\"[^\"]+\"" | head -20 | tr '\n' ' ' > /tmp/refs.txt || true
          echo "::notice::ohm-refs $(cat /tmp/refs.txt)"
          echo "::notice::ohm-list $(grep -oE '<Key>[^<]+</Key>' /tmp/l.xml | sed 's/<[^>]*>//g' | head -40 | tr '\n' ' ')"
      - if: inputs.task == 'ohm-probe'
        run: mlm ohm-probe   # report only: tiles, name search and old names against OpenHistoricalMap
      - if: inputs.task == 'pool-backfill'
        run: mlm pool backfill   # enter already-loaded documents into the resource pool
      - if: inputs.task == 'regeocode-fujian'
        run: |
          mlm regeocode --unit CN-FJ
          mlm refresh-site
      - if: inputs.task == 'regeocode-guangdong'
        run: |
          mlm regeocode --unit CN-GD
          mlm refresh-site
