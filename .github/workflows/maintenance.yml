name: Maintenance

# One-off data maintenance, run by hand. No model calls, except verify-recheck (the trusted verifier's support check).
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [dedupe-dry-run, dedupe, refresh-site, regeocode-jiangsu, regeocode-shanghai, pool-backfill, locate-dry-run, locate-apply, verify-recheck-dry-run, verify-recheck]
        default: dedupe-dry-run

permissions:
  contents: read

concurrency:
  group: coverage-agents  # never alongside the worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMAP_KEY: ${{ secrets.AMAP_KEY }}  # optional: Amap POI search
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - if: inputs.task == 'dedupe-dry-run'
        run: mlm dedupe --dry-run
      - if: inputs.task == 'dedupe'
        run: mlm dedupe
      - if: inputs.task == 'refresh-site'
        run: mlm refresh-site
      - if: inputs.task == 'verify-recheck-dry-run'
        run: mlm verify-recheck --dry-run
      - if: inputs.task == 'verify-recheck'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MLM_BATCH_WAIT_MIN: "15"
        run: mlm verify-recheck   # unit gates and STATUS.md refresh in the daily coverage-sync
      - if: inputs.task == 'regeocode-jiangsu'
        run: |
          mlm regeocode --unit CN-JS
          mlm refresh-site
      - if: inputs.task == 'regeocode-shanghai'
        run: |
          mlm regeocode --unit CN-SH
          mlm refresh-site
      - if: inputs.task == 'locate-dry-run'
        run: mlm locate   # report only: candidates are listed in the job summary
      - if: inputs.task == 'locate-apply'
        run: |
          mlm locate --apply
          mlm refresh-site
      - if: inputs.task == 'pool-backfill'
        run: mlm pool backfill   # enter already-loaded documents into the resource pool
