name: Submissions sync

# Hourly: copy new in-app submissions from Supabase into GitHub issues.
# Plain API calls, no model, so it costs nothing when idle.

on:
  schedule:
    - cron: "7 * * * *"   # hourly: every run bills at least a minute
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: submissions-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fpnbaczwbvyamsirybug.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - run: mlm submissions
